<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Log — Job Tracker</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    .contact-table { width:100%; border-collapse:collapse; font-size:14px; }
    .contact-table th {
      background:var(--bg); text-align:left; padding:8px 12px;
      border-bottom:2px solid var(--border); white-space:nowrap;
      font-size:13px; color:var(--muted);
    }
    .contact-table td { padding:8px 12px; border-bottom:1px solid var(--border); vertical-align:top; }
    .contact-table tr:last-child td { border-bottom:none; }
    .contact-table tr:hover td { background:#f8fafc; cursor:pointer; }
    .td-name { font-weight:600; }
    .td-notes { color:var(--muted); font-size:13px; max-width:260px; }

    .response-badge {
      display:inline-block; padding:2px 10px; border-radius:12px;
      font-size:12px; font-weight:600; white-space:nowrap;
    }
    .resp-yes   { background:#dcfce7; color:#166534; }
    .resp-no    { background:#fee2e2; color:#991b1b; }
    .resp-pending { background:#fef3c7; color:#92400e; }
    .resp-other { background:#e0e7ff; color:#3730a3; }

    /* Modal */
    .modal-overlay { position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:center;justify-content:center; }
    .modal-overlay.hidden { display:none; }
    .modal { background:#fff;border-radius:10px;width:520px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25); }
    .modal-header { padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between; }
    .modal-header h2 { font-size:16px;margin:0; }
    .modal-body { padding:20px; }
    .modal-footer { padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px; }
    .field { margin-bottom:14px; }
    .field label { display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:var(--muted); }
    .field input, .field select, .field textarea {
      width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:5px;font-size:14px;box-sizing:border-box;
    }
    .field textarea { resize:vertical; min-height:80px; }

    /* Reach out type manager */
    .rot-manager { margin-top:2rem; }
    .rot-manager h3 { font-size:14px;font-weight:600;color:var(--muted);margin-bottom:.75rem; }
    .rot-list { display:flex;flex-wrap:wrap;gap:8px;margin-bottom:.75rem; }
    .rot-chip {
      display:inline-flex;align-items:center;gap:6px;
      background:#f1f5f9;border:1px solid var(--border);border-radius:20px;
      padding:4px 12px;font-size:13px;
    }
    .rot-chip button { background:none;border:none;cursor:pointer;color:#94a3b8;font-size:15px;line-height:1;padding:0; }
    .rot-chip button:hover { color:#dc2626; }
    .rot-add-row { display:flex;gap:8px; }
    .rot-add-row input { flex:1;max-width:240px;padding:6px 10px;border:1px solid var(--border);border-radius:5px;font-size:13px; }
  </style>
</head>
<body>

<nav>
  <a class="brand" href="/">Job Tracker</a>
  <a href="/dashboard">Dashboard</a>
  <a href="/">Applications</a>
  <a href="/contact-log" class="active">Contact Log</a>
  <a href="/target-companies">Target Companies</a>
  <a href="/skills-demand">Skills In Demand</a>
  <a href="/distances">Distances</a>
</nav>

<div class="page">
  <div class="toolbar">
    <h1>Contact Log</h1>
    <button class="btn btn-primary" onclick="openNew()">+ New Contact</button>
  </div>

  <div class="card" style="padding:0;overflow:hidden">
    <table class="contact-table">
      <thead><tr>
        <th>Date</th>
        <th>Name</th>
        <th>Reach Out Type</th>
        <th>Response</th>
        <th>Notes</th>
      </tr></thead>
      <tbody id="contact-tbody">
        <tr><td colspan="5" style="padding:2rem;text-align:center;color:var(--muted)">Loading…</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Reach out type manager -->
  <div class="rot-manager">
    <h3>Reach Out Types</h3>
    <div class="rot-list" id="rot-list"></div>
    <div class="rot-add-row">
      <input type="text" id="rot-input" placeholder="New type…" onkeydown="if(event.key==='Enter') addRotType()" />
      <button class="btn btn-secondary btn-sm" onclick="addRotType()">Add</button>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay hidden" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">New Contact</h2>
      <button class="btn btn-secondary btn-sm" onclick="closeModal()">✕</button>
    </div>
    <form class="modal-body" id="contact-form" onsubmit="saveContact(event)">
      <div class="field">
        <label>Date</label>
        <input type="date" name="date" />
      </div>
      <div class="field">
        <label>Name</label>
        <input type="text" name="name" placeholder="Person's name or company" required />
      </div>
      <div class="field">
        <label>Reach Out Type</label>
        <select name="reach_out_type" id="rot-select">
          <option value="">— select —</option>
        </select>
      </div>
      <div class="field">
        <label>Response</label>
        <select name="response">
          <option value="">— select —</option>
          <option>Yes</option>
          <option>No</option>
          <option>Pending</option>
          <option>No Response</option>
        </select>
      </div>
      <div class="field">
        <label>Notes</label>
        <textarea name="notes" placeholder="Any notes about the interaction…"></textarea>
      </div>
    </form>
    <div class="modal-footer">
      <button type="button" class="btn btn-danger" id="btn-delete" style="display:none;margin-right:auto" onclick="deleteContact()">Delete</button>
      <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button type="submit" form="contact-form" class="btn btn-primary">Save</button>
    </div>
  </div>
</div>

<script>
let editingId = null;
let rotTypes = [];

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function responseBadge(r) {
  if (!r) return '—';
  const cls = r === 'Yes' ? 'resp-yes' : r === 'No' ? 'resp-no' : r === 'Pending' ? 'resp-pending' : 'resp-other';
  return `<span class="response-badge ${cls}">${esc(r)}</span>`;
}

async function load() {
  const [contacts, types] = await Promise.all([
    fetch('/api/contact-log').then(r => r.json()),
    fetch('/api/reach-out-types').then(r => r.json()),
  ]);
  rotTypes = types;
  renderTable(contacts);
  renderRotList(types);
  renderRotSelect(types);
}

function renderTable(contacts) {
  const tbody = document.getElementById('contact-tbody');
  if (!contacts.length) {
    tbody.innerHTML = '<tr><td colspan="5" style="padding:2rem;text-align:center;color:var(--muted)">No contacts logged yet.</td></tr>';
    return;
  }
  tbody.innerHTML = contacts.map(c => `
    <tr onclick="openEdit(${c.id})">
      <td class="nowrap">${c.date || '—'}</td>
      <td class="td-name">${esc(c.name)}</td>
      <td>${esc(c.reach_out_type || '—')}</td>
      <td>${responseBadge(c.response)}</td>
      <td class="td-notes">${esc(c.notes || '')}</td>
    </tr>`).join('');
}

function renderRotList(types) {
  const list = document.getElementById('rot-list');
  if (!types.length) { list.innerHTML = '<span style="color:var(--muted);font-size:13px">No types yet.</span>'; return; }
  list.innerHTML = types.map(t =>
    `<span class="rot-chip">${esc(t.name)}<button onclick="deleteRotType(${t.id})" title="Remove">×</button></span>`
  ).join('');
}

function renderRotSelect(types) {
  const sel = document.getElementById('rot-select');
  const current = sel.value;
  sel.innerHTML = '<option value="">— select —</option>' +
    types.map(t => `<option value="${esc(t.name)}" ${t.name === current ? 'selected' : ''}>${esc(t.name)}</option>`).join('');
}

function openNew() {
  editingId = null;
  document.getElementById('modal-title').textContent = 'New Contact';
  document.getElementById('btn-delete').style.display = 'none';
  document.getElementById('contact-form').reset();
  document.querySelector('[name=date]').value = new Date().toISOString().slice(0, 10);
  renderRotSelect(rotTypes);
  document.getElementById('modal-overlay').classList.remove('hidden');
}

function openEdit(id) {
  fetch(`/api/contact-log/${id}`).then(r => r.json()).then(c => {
    editingId = id;
    document.getElementById('modal-title').textContent = 'Edit Contact';
    document.getElementById('btn-delete').style.display = '';
    const form = document.getElementById('contact-form');
    form.reset();
    renderRotSelect(rotTypes);
    for (const [k, v] of Object.entries(c)) {
      const el = form.elements[k];
      if (el && v !== null && v !== undefined) el.value = v;
    }
    document.getElementById('modal-overlay').classList.remove('hidden');
  });
}

function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
}

async function saveContact(e) {
  e.preventDefault();
  const form = document.getElementById('contact-form');
  const data = Object.fromEntries(
    [...form.elements]
      .filter(el => el.name)
      .map(el => [el.name, el.value || null])
  );

  if (editingId) {
    await fetch(`/api/contact-log/${editingId}`, {
      method: 'PATCH', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(data),
    });
  } else {
    await fetch('/api/contact-log', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(data),
    });
  }
  closeModal();
  load();
}

async function deleteContact() {
  if (!editingId || !confirm('Delete this contact entry?')) return;
  await fetch(`/api/contact-log/${editingId}`, { method: 'DELETE' });
  closeModal();
  load();
}

async function addRotType() {
  const input = document.getElementById('rot-input');
  const name = input.value.trim();
  if (!name) return;
  const res = await fetch('/api/reach-out-types', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ name }),
  });
  if (res.ok || res.status === 409) {
    input.value = '';
    load();
  }
}

async function deleteRotType(id) {
  await fetch(`/api/reach-out-types/${id}`, { method: 'DELETE' });
  load();
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

load();
</script>
</body>
</html>
